# Day 1: our very first pipeline.
# GitHub runs this file every time someone pushes code to the repository.

name: Hello Pipeline

on: push

jobs:
  say-hello:
    runs-on: ubuntu-latest

    steps:
      - name: Say hello
        run: echo "Hello from GitHub Actions!"

      - name: Show facts about this run
        run: |
          echo "Repository: ${{ github.repository }}"
          echo "Branch:     ${{ github.ref_name }}"
          echo "Commit:     ${{ github.sha }}"
          echo "Pushed by:  ${{ github.actor }}"

      - name: Look around the machine
        run: |
          echo "This is a brand-new computer in the cloud."
          uname -a
          node --version
          echo "Files in the current folder:"
          ls -la
